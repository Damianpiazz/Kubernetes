services:
  eureka-server:
    ports:
      - "8761:8761"

  auth-service:
    ports:
      - "8081:8080"

  user-service:
    ports:
      - "8082:8080"

  product-service:
    ports:
      - "8083:8080"

  order-service:
    ports:
      - "8084:8080"

  payment-service:
    ports:
      - "8085:8080"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "8090:8080"
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:8.13
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-changeme}
    ports:
      - "5050:80"
    profiles: ["tools"]
    networks:
      - data-auth
      - data-users
      - data-products
      - data-orders
      - data-payments
    restart: unless-stopped
