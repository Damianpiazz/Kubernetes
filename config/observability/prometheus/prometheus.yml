global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: latiendita
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - auth-service:8080
          - user-service:8080
          - product-service:8080
          - order-service:8080
          - payment-service:8080
          - gateway:8080
          - eureka-server:8761
