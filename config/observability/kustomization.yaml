apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ConfigMaps generados desde los archivos de configuración del stack.
#
# Fuente única de verdad: los mismos archivos se montan en Docker
# (ver compose.observability.yaml) y se embeben acá como ConfigMaps para
# Kubernetes, así las dos formas de levantar la observabilidad no se
# desincronizan.
#
# Kustomize no permite referenciar archivos fuera de la raíz del kustomization,
# por eso este archivo vive en config/observability/ y k8s/observability/base
# lo incluye como resource (referenciar un directorio con kustomization.yaml sí
# está permitido). El namespace lo pone quien lo incluye.
#
# IMPORTANTE: acá NO van credenciales. El secreto de Grafana se genera en cada
# environment (k8s/observability/environments/<entorno>), igual que
# latiendita-secrets en k8s/apps/environments/local.

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  # Prometheus: la variante k8s (kubernetes_sd). En Docker se usa
  # prometheus/prometheus.yml, que tiene la lista estática de targets.
  - name: prometheus-config
    files:
      - prometheus.yml=prometheus/prometheus.k8s.yml

  - name: prometheus-rules
    files:
      - latiendita.yml=prometheus/rules/latiendita.yml

  # Loki: el mismo loki.yml que usa Docker (incluye el ruler -> Alertmanager).
  - name: loki-config
    files:
      - loki.yml=loki/loki.yml

  - name: loki-rules
    files:
      - latiendita-logs.yml=loki/rules/fake/latiendita-logs.yml

  - name: tempo-config
    files:
      - tempo.yml=tempo/tempo.yml

  - name: alertmanager-config
    files:
      - alertmanager.yml=alertmanager/alertmanager.yml

  # Alloy: la variante k8s (logs vía API de Kubernetes). En Docker se usa
  # alloy/config.alloy (logs vía docker.sock).
  - name: alloy-config
    files:
      - config.alloy=alloy/config.k8s.alloy

  # Provisioning de Grafana (las URLs usan nombres cortos de Service, todos
  # viven en el mismo namespace).
  - name: grafana-datasources
    files:
      - datasources.yml=grafana/provisioning/datasources/datasources.yml

  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=grafana/provisioning/dashboards/dashboards.yml

  - name: grafana-dashboards
    files:
      - latiendita.json=grafana/dashboards/latiendita.json

