# Azurite: emulador oficial de Azure Blob Storage (mcr.microsoft.com).
# Solo aplica en local: k8s/data/base NO se incluye en producción, donde el
# storage de imágenes es Azure Blob Storage (servicio gestionado, §9 de
# docs/kubernetes/configuracion.md).
#
# Patrón idéntico a los StatefulSets de PostgreSQL (k8s/data/base/postgres/*):
# PVC propio por volumeClaimTemplates, sin token de la API, probes sobre el
# puerto de negocio. Se usan probes TCP porque la imagen no trae shell ni curl.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: azurite
  labels:
    app.kubernetes.io/name: azurite
    app.kubernetes.io/part-of: la-tiendita
spec:
  serviceName: azurite
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: azurite
  template:
    metadata:
      labels:
        app.kubernetes.io/name: azurite
        app.kubernetes.io/part-of: la-tiendita
    spec:
      # Azurite no habla con la API de Kubernetes (mismo criterio que Postgres):
      # va con la SA default pero sin token montado.
      automountServiceAccountToken: false
      containers:
        - name: azurite
          image: mcr.microsoft.com/azure-storage/azurite:3.34.0
          imagePullPolicy: IfNotPresent
          args:
            - azurite
            - --blobHost
            - "0.0.0.0"
            - --queueHost
            - "0.0.0.0"
            - --tableHost
            - "0.0.0.0"
            - --location
            - /data
          ports:
            - name: blob
              containerPort: 10000
            - name: queue
              containerPort: 10001
            - name: table
              containerPort: 10002
          startupProbe:
            tcpSocket:
              port: blob
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: blob
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Más permisivo que readiness (mismo criterio que Postgres): un pico
          # no debe reiniciar el pod. Solo readiness lo saca del Service.
          livenessProbe:
            tcpSocket:
              port: blob
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            # Sin readOnlyRootFilesystem: Azurite escribe los metadatos de los
            # blobs en --location (/data, la PVC).
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
