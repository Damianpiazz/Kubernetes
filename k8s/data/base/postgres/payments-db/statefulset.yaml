apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: payments-db
  labels:
    app.kubernetes.io/name: payments-db
    app.kubernetes.io/part-of: la-tiendita
spec:
  serviceName: payments-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: payments-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payments-db
        app.kubernetes.io/part-of: la-tiendita
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          env:
            # Subdirectorio propio: con lost+found en la raíz del PV (típico
            # en EBS/GCE) el initdb de Postgres se niega a inicializar.
            # ATENCIÓN: en un volume YA inicializado los datos quedan "vacíos"
            # (Postgres re-initdb en el subdir). Antes de aplicar sobre un
            # clúster con datos: copiar el contenido al subdirectorio o wipe.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: payments
            - name: POSTGRES_USER
              value: payments
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: latiendita-secrets
                  key: PAYMENTS_DB_PASSWORD
          ports:
            - name: pg
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-U", "payments", "-d", "payments"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "payments", "-d", "payments"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Más permisivo que readiness: un pico de conexiones (max_connections
          # saturado) o una recovery no deben reiniciar la DB. Solo readiness
          # saca el pod del Service; el restart queda para un caso real.
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "payments", "-d", "payments"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5      # ~150s de fallas antes de reiniciar
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: payments-db
  labels:
    app.kubernetes.io/name: payments-db
    app.kubernetes.io/part-of: la-tiendita
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: payments-db
  ports:
    - name: pg
      port: 5432
      targetPort: pg
