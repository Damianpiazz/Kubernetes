apiVersion: v1
kind: Service
metadata:
  name: gateway
  annotations:
    # Las usa Prometheus con kubernetes_sd (role: endpoints), ver
    # observability/prometheus/prometheus.k8s.yml
    prometheus.io/scrape: "true"
    prometheus.io/path: /actuator/prometheus
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: la-tiendita
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
