apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entorno local (kind / k3d) del stack de observabilidad.
#
#   scripts/kind-up.ps1  (o)  kubectl apply -k k8s/observability/environments/local
#
# Hoy no agrega patches sobre la base: existe para que todos los stacks tengan
# el mismo punto de entrada (k8s/<stack>/environments/<entorno>) y para acá
# vivan las credenciales de desarrollo de Grafana, que no corresponden a
# config/observability (ese directorio es configuración compartida con Docker).
namespace: latiendita-observability

resources:
  - ../../base

# Credenciales de DESARROLLO de Grafana. Viven en secrets.env (gitignored),
# mismo patrón que el resto de los environments: se generan con
# `scripts/secrets.* observability-local` desde secrets.env.example. En
# producción se reemplazan en k8s/observability/environments/production.
# Si secrets.env no existe, `kubectl kustomize` falla (no se rinde un
# admin/admin commiteado).
secretGenerator:
  - name: grafana-admin
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true
