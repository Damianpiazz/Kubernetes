# ServiceAccounts del stack de observabilidad (namespace latiendita-observability).
#
# El RBAC de lectura que necesitan NO vive acá: como este kustomization fuerza
# `namespace: latiendita-observability`, un Role creado desde acá quedaría en el
# namespace equivocado. El Role+RoleBinding que autoriza a prometheus y alloy a
# leer los recursos de la aplicación está en
# k8s/apps/base/observability-rbac.yaml (namespace latiendita, que es el que
# protege). Ambos stacks siguen aplicándose por separado: el Role se crea con
# apps y no hace falta recrearlo al actualizar observabilidad.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: la-tiendita
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: la-tiendita
---
# ServiceAccounts de los componentes que NO hablan con la API de Kubernetes
# (grafana, loki, tempo, alertmanager). Con automountServiceAccountToken: false
# sus pods no llevan montado un JWT de identidad del clúster: es superficie de
# ataque gratis. Solo prometheus y alloy necesitan la API (kubernetes_sd,
# loki.source.kubernetes) y sus SAs de arriba la conservan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: loki
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tempo
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: alertmanager
  labels:
    app.kubernetes.io/name: alertmanager
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
