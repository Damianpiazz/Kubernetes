# Alloy recolecta los logs de los pods de la aplicación (namespace latiendita)
# usando la API de Kubernetes, y recibe el OTLP que envían las apps para
# reenviarlo a Tempo. Va como DaemonSet: un contenedor por nodo.
#
# Seguridad: la imagen no declara USER, así que se fija explícitamente el uid
# 473 (el que la imagen usa para /var/lib/alloy/data; el emptyDir se ajusta con
# fsGroup) con runAsNonRoot + drop: [ALL] + seccomp RuntimeDefault.
#
# PENDIENTE (§15): las posiciones de tail están en emptyDir → al recrearse el
# pod se pierden y Loki puede recibir logs duplicados/faltantes. Persistirlas
# exige hostPath (un PVC RWO no se monta en todos los nodos de un DaemonSet),
# lo que violaría la regla "sin hostPath" del repo.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: la-tiendita
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alloy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alloy
        app.kubernetes.io/part-of: la-tiendita
    spec:
      serviceAccountName: alloy
      securityContext:
        runAsNonRoot: true
        runAsUser: 473
        runAsGroup: 473
        fsGroup: 473
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alloy
          image: grafana/alloy:v1.20.1
          imagePullPolicy: IfNotPresent
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: ui
              containerPort: 12345
          startupProbe:
            httpGet:
              path: /-/ready
              port: ui
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /-/ready
              port: ui
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness sobre /-/healthy (no sobre /-/ready como antes): readiness
          # baja el pod del Service si no puede exportar; liveness solo debe
          # reiniciarlo si el proceso se colgó. Un bache de Tempo/Loki no debe
          # reciclar el DaemonSet de logs.
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: ui
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alloy/config.alloy
              subPath: config.alloy
              readOnly: true
            - name: data
              mountPath: /var/lib/alloy/data
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: data
          emptyDir: {}
---
# Service interno: las apps de la aplicación le envían traces por OTLP
# (OTLP_TRACING_ENDPOINT en k8s/apps/base/<servicio>/configmap.yaml).
apiVersion: v1
kind: Service
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/part-of: la-tiendita
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "12345"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: alloy
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    - name: ui
      port: 12345
      targetPort: ui
