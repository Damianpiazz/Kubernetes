# El dashboard, los datasources y el provisioning salen de ConfigMaps generados
# desde config/observability/ (fuente única de verdad compartida con Docker).
#
# Acceso local:   kubectl port-forward -n latiendita-observability svc/grafana 3000:3000
# Acceso prod:    k8s/observability/environments/production (ingress /grafana)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: la-tiendita
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # PVC RWO + RollingUpdate = deadlock en multi-nodo: con 1 réplica
  # maxUnavailable calcula 0, el pod nuevo se crea primero y si cae en OTRO
  # nodo no puede montar el volumen (Multi-Attach) mientras el viejo exista.
  # Recreate termina el viejo antes de crear el nuevo: unos segundos sin
  # Grafana a cambio de no poder quedar el deploy colgado.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: la-tiendita
    spec:
      serviceAccountName: grafana
      securityContext:
        # La imagen corre como grafana (472:472).
        fsGroup: 472
      containers:
        - name: grafana
          image: grafana/grafana:13.2.3
          imagePullPolicy: IfNotPresent
          env:
            # envFrom en lugar de inyectar por clave: las credenciales las
            # genera el propio kustomization desde secrets.env (gitignored) y
            # el guard de deploy.* valida TODAS las claves de ese archivo en
            # targets de producción (exit 6 si siguen siendo de plantilla).
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: "false"
            - name: GF_ANALYTICS_CHECK_FOR_UPDATES
              value: "false"
          envFrom:
            - secretRef:
                name: grafana-admin
          ports:
            - name: http
              containerPort: 3000
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards
              readOnly: true
            - name: data
              mountPath: /var/lib/grafana
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-dashboards
        - name: data
          persistentVolumeClaim:
            claimName: grafana-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: la-tiendita
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: la-tiendita
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "3000"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: grafana
  ports:
    - name: http
      port: 3000
      targetPort: http
