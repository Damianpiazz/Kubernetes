apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: la-tiendita
spec:
  # Reemplazar CHANGE-ME: ingressClassName del controlador instalado en el
  # clúster y host DNS apuntando al balanceador.
  #
  # Va en un host propio (no bajo /grafana del host de las apps) para evitar
  # el modo subpath de Grafana, que requiere GF_SERVER_ROOT_URL +
  # GF_SERVER_SERVE_FROM_SUB_PATH y es propenso a romper assets.
  ingressClassName: CHANGE-ME
  rules:
    - host: grafana.CHANGE-ME.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
