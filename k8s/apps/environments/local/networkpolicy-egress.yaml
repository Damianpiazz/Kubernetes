# Aislamiento de EGRESS — SOLO el entorno local (kind / k3d).
#
# En local toda la infraestructura vive en el clúster (Postgres y Kafka son
# StatefulSets del mismo namespace), así que se puede negar el tráfico saliente
# y abrirlo punto por punto:
#
#   apps → DNS (kube-system)                    :53    [resolución corta: kafka, *-db]
#   apps → Postgres / Kafka (mismo namespace)   :5432 / :9092
#   apps → azurite (mismo namespace)            :10000 [storage de imágenes]
#   apps → alloy (ns latiendita-observability)  :4318  [OTLP]
#   apps → backends (proxy del gateway, order→product, payment→order) :8080
#
# Los pods de datos (Postgres/Kafka/Azurite) no generan tráfico saliente; no
# reciben permisos de egress y quedan sin salir del clúster.
#
# En producción NO se aplica: las bases de datos y Kafka son servicios
# gestionados con endpoints externos, y un deny de egress los rompería sin
# forma portable de declararlos (depende de la CNI: FQDN solo lo soportan
# Cilium y similares).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector: {}
  policyTypes:
    - Egress
---
# DNS hacia CoreDNS (kube-system). Sin esto nada resuelve nombres cortos.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
# Salida de las apps hacia el tier de datos del mismo namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-data
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-db
                  - users-db
                  - products-db
                  - orders-db
                  - payments-db
                  - kafka
                  - azurite
      ports:
        - port: 5432
          protocol: TCP
        - port: 9092
          protocol: TCP
        - port: 10000
          protocol: TCP
---
# Tráfico este-oeste entre servicios: el espejo de allow-app-ingress (base).
# NetworkPolicy exige que AMBOS extremos permitan el flujo; sin esta política
# el default-deny-egress corta el proxy del gateway hacia los backends y las
# llamadas REST entre servicios (order→product, payment→order). Síntoma
# engañoso: el gateway contesta 401 vía /error cuando el backend no responde.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-east-west
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway
  policyTypes:
    - Egress
  egress:
    # El gateway enruta /api/auth, /api/users, /api/products, /api/orders y
    # /api/payments hacia cada backend.
    - to:
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - auth-service
                  - user-service
                  - product-service
                  - order-service
                  - payment-service
      ports:
        - port: 8080
          protocol: TCP
    # order-service consulta el stock vía REST (PRODUCT_SERVICE_BASE_URL).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: product-service
      ports:
        - port: 8080
          protocol: TCP
    # payment-service confirma el estado del pedido vía REST
    # (ORDER_SERVICE_BASE_URL).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: order-service
      ports:
        - port: 8080
          protocol: TCP
---
# Salida de las apps hacia Alloy (OTLP cross-namespace). FQDN en los
# configmaps (alloy.latiendita-observability.svc…); acá se matchea por el
# label del namespace destino + pods de Alloy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-egress-otlp
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - auth-service
          - user-service
          - product-service
          - order-service
          - payment-service
          - gateway
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: latiendita-observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alloy
      ports:
        - port: 4318
          protocol: TCP
---
# Salida de payment-service a la API de Mercado Pago (api.mercadopago.com:443).
# Sin esta regla el SDK no puede crear preferencias ni consultar pagos desde
# kind/k3d, y el default-deny-egress de arriba se traga el error en silencio.
#
# NetworkPolicy no entiende FQDN: con las CNI del stack local (kindnetd,
# flannel) solo se puede matchear por IP, y las de Mercado Pago cambian. Por
# eso se abre 0.0.0.0/0 SOLO en el puerto 443 y SOLO desde los pods de
# payment-service: es lo mínimo que funciona sin depender de una lista de IPs
# ajena. Si más adelante la CNI soporta dominios (Cilium y similares), acotar
# a api.mercadopago.com.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-payment-egress-https
  labels:
    app.kubernetes.io/part-of: la-tiendita
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: payment-service
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
