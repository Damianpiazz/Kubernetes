apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Entorno local (kind / k3d): aplicación + tier de datos dentro del clúster.
#
#   scripts/kind-up.ps1  (o)  kubectl apply -k k8s/apps/environments/local
#
# Regla del repo: nunca se aplica k8s/apps/base directamente; el punto de
# entrada siempre es un environment, porque los secretos se generan acá.
namespace: latiendita

resources:
  - ../../base
  # Tier de datos SOLO para este entorno: en producción las bases de datos y
  # Kafka son servicios gestionados (ver el configMapGenerator del overlay de
  # producción, que sobrescribe SPRING_DATASOURCE_URL y KAFKA_BOOTSTRAP_SERVERS).
  - ../../../data/base
  # Egress aislado (solo local: acá todo es in-cluster; ver el archivo).
  - networkpolicy-egress.yaml

# Seed de desarrollo: mismos JSON que trae la imagen (classpath), solo se
# enciende. Insert-only y idempotente, así que un rollout restart no duplica
# datos. No existe en producción: el runner ni se instancia sin la variable.
configMapGenerator:
  - name: auth-service-config
    behavior: merge
    literals:
      - APP_SEED_ENABLED=true
  - name: product-service-config
    behavior: merge
    literals:
      - APP_SEED_ENABLED=true
  # URLs de Mercado Pago para kind / k3d.
  #
  # No hay Ingress en local (se entra por port-forward), así que Mercado Pago
  # no puede tocar el clúster: hace falta un túnel público que repunte al
  # port-forward del gateway (webhook) y del frontend (retorno del checkout).
  # Reemplazar CHANGE-ME-tunel por el dominio que entregue ngrok o cloudflared.
  #
  #   kubectl port-forward svc/gateway 8080:80 -n latiendita
  #   kubectl port-forward svc/frontend 3000:80 -n latiendita
  #   ngrok http 8080        # -> CHANGE-ME-tunel.ngrok-free.app
  #
  # Ojo: las back_urls NO aceptan localhost, por eso también van por el túnel.
  - name: payment-service-config
    behavior: merge
    literals:
      - MERCADO_PAGO_NOTIFICATION_URL=https://CHANGE-ME-tunel/api/webhooks/mercado-pago
      - MERCADO_PAGO_BACK_URL_SUCCESS=https://CHANGE-ME-tunel/checkout/success
      - MERCADO_PAGO_BACK_URL_FAILURE=https://CHANGE-ME-tunel/checkout/failure
      - MERCADO_PAGO_BACK_URL_PENDING=https://CHANGE-ME-tunel/checkout/pending

secretGenerator:
  - name: latiendita-secrets
    envs:
      - secrets.env

generatorOptions:
  disableNameSuffixHash: true

patches:
  # El seed de product-service sube las fotos de catálogo a Azurite en el
  # arranque (best-effort, sin retry): si Azurite todavía no acepta
  # conexiones, las imágenes quedan sin subir hasta el próximo restart del
  # pod. El init container ya espera products-db por el mismo motivo; acá se
  # agrega la espera de Azurite. Strategic merge por nombre (wait-for-deps),
  # el resto del init container (image, resources, securityContext) se
  # mantiene de k8s/apps/base. Solo local: en producción no existe Azurite
  # (el storage es Azure Blob gestionado), por eso va en el overlay y no en
  # el base.
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: product-service
      spec:
        template:
          spec:
            initContainers:
              - name: wait-for-deps
                command:
                  - sh
                  - -c
                  - |
                    until nc -z products-db 5432; do echo "waiting for products-db:5432"; sleep 2; done
                    until nc -z azurite 10000; do echo "waiting for azurite:10000"; sleep 2; done
                    echo "dependencies ready"
