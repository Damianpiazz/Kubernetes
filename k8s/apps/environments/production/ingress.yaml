apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: la-tiendita
  labels:
    app.kubernetes.io/part-of: la-tiendita
  annotations:
    # cert-manager emite y renueva el certificado (Let's Encrypt, HTTP-01).
    # Requisitos: cert-manager instalado en el clúster y el ClusterIssuer
    # aplicado (k8s/cluster-scope/clusterissuer-letsencrypt.yaml).
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  # Reemplazar CHANGE-ME: ingressClassName del controlador instalado en el
  # clúster (nginx, traefik, gateway-api, etc.) y host DNS apuntando al
  # balanceador. Un SOLO host sirve la UI (/) y la API (/api): mismo origen,
  # el navegador no cruza CORS (CORS_ALLOWED_ORIGINS queda como respaldo).
  ingressClassName: CHANGE-ME
  tls:
    # El Secret lo crea y renueva cert-manager (no se commitea ni se genera con
    # scripts/secrets.*). Mismo host que las reglas de abajo.
    - hosts:
        - CHANGE-ME.example.com
      secretName: la-tiendita-tls
  rules:
    - host: CHANGE-ME.example.com
      http:
        paths:
          # /api es más específico que /: el prefijo no llega al frontend.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
