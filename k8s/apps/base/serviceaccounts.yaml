# ServiceAccounts de los siete servicios (namespace latiendita).
#
# Una SA por servicio con `automountServiceAccountToken: false`: ninguna app
# habla con la API de Kubernetes, así que ningún pod debe llevar un JWT de
# identidad montado en /var/run/secrets/kubernetes.io/serviceaccount (superficie
# de ataque: cualquier RCE/exfiltración en un servicio quedaría con una
# credencial válida del clúster). Además, con SA propio el audit log atribuye
# cada llamada al servicio correcto en vez de a `default`.
#
# Si algún día un servicio necesita la API (p. ej. un operador), se le habilita
# el automount SOLO a esa SA y se le agrega el Role/RoleBinding mínimo, siguiendo
# el patrón de k8s/apps/base/observability-rbac.yaml.
#
# El tier de datos (Postgres/Kafka) no necesita SA: solo lleva
# automountServiceAccountToken: false en su pod spec.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: user-service
  labels:
    app.kubernetes.io/name: user-service
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: product-service
  labels:
    app.kubernetes.io/name: product-service
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-service
  labels:
    app.kubernetes.io/name: order-service
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service
  labels:
    app.kubernetes.io/name: payment-service
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: la-tiendita
automountServiceAccountToken: false
