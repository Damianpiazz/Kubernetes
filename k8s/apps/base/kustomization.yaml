apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: latiendita

resources:
  - namespace.yaml
  - observability-rbac.yaml
  - serviceaccounts.yaml
  - networkpolicy.yaml
  - auth-service/configmap.yaml
  - auth-service/deployment.yaml
  - auth-service/service.yaml
  - user-service/configmap.yaml
  - user-service/deployment.yaml
  - user-service/service.yaml
  - product-service/configmap.yaml
  - product-service/deployment.yaml
  - product-service/service.yaml
  - order-service/configmap.yaml
  - order-service/deployment.yaml
  - order-service/service.yaml
  - payment-service/configmap.yaml
  - payment-service/deployment.yaml
  - payment-service/service.yaml
  - gateway/configmap.yaml
  - gateway/deployment.yaml
  - gateway/service.yaml
  # Frontend (Next.js): sin configmap a propósito — su URL de API y su modo de
  # datos (NEXT_PUBLIC_API_URL / NEXT_PUBLIC_DATA_MODE) son build-args (se
  # inlinean en el bundle), no config runtime. Ver frontend/Dockerfile.
  - frontend/deployment.yaml
  - frontend/service.yaml
