auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      # Directorio del ruler storage (tenant "fake" porque auth_enabled: false).
      rules_directory: /etc/loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

ruler:
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true
  evaluation_interval: 1m
  # Directorio temporal de evaluación: debe ser escribible por el usuario de la imagen.
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  storage:
    type: local
    local:
      directory: /etc/loki/rules
