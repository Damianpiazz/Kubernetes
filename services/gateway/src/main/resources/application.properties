spring.application.name=gateway
server.port=${SERVER_PORT:8080}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true

spring.cloud.gateway.server.webmvc.routes[0].id=auth
spring.cloud.gateway.server.webmvc.routes[0].uri=${AUTH_SERVICE_BASE_URL:lb://authService}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webmvc.routes[1].id=users
spring.cloud.gateway.server.webmvc.routes[1].uri=${USER_SERVICE_BASE_URL:lb://userService}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/users/**

spring.cloud.gateway.server.webmvc.routes[2].id=products
spring.cloud.gateway.server.webmvc.routes[2].uri=${PRODUCT_SERVICE_BASE_URL:lb://productService}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/products/**,/api/categories/**

spring.cloud.gateway.server.webmvc.routes[3].id=orders
spring.cloud.gateway.server.webmvc.routes[3].uri=${ORDER_SERVICE_BASE_URL:lb://orderService}
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.server.webmvc.routes[4].id=payments
spring.cloud.gateway.server.webmvc.routes[4].uri=${PAYMENT_SERVICE_BASE_URL:lb://paymentService}
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.server.webmvc.routes[5].id=webhooks
spring.cloud.gateway.server.webmvc.routes[5].uri=${PAYMENT_SERVICE_BASE_URL:lb://paymentService}
spring.cloud.gateway.server.webmvc.routes[5].predicates[0]=Path=/api/webhooks/**

spring.http.clients.connect-timeout=${GATEWAY_CONNECT_TIMEOUT_MS:2000}
spring.http.clients.read-timeout=${GATEWAY_READ_TIMEOUT_MS:10000}

jwt.secret=${JWT_SECRET:local-dev-secret-please-change-32chars}
jwt.issuer=${JWT_ISSUER:auth-service}

gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
gateway.cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
gateway.cors.allowed-headers=${CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-Id}
gateway.cors.allow-credentials=true
gateway.cors.max-age=PT1H

gateway.limits.max-request-size=${GATEWAY_MAX_REQUEST_SIZE:1048576}

gateway.ratelimit.default-capacity=60
gateway.ratelimit.default-refill-tokens=60
gateway.ratelimit.default-refill-interval=PT1M
gateway.ratelimit.routes.auth.capacity=10
gateway.ratelimit.routes.auth.refill-tokens=10
gateway.ratelimit.routes.auth.refill-interval=PT1M
gateway.ratelimit.excluded-paths=/api/webhooks/**,/actuator/**

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
logging.level.root=${LOGGING_LEVEL_ROOT:INFO}
