spring.application.name=paymentService

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_INTERVAL_MS:1000}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS:10}

order-service.base-url=${ORDER_SERVICE_BASE_URL:http://localhost:8080}

payment.provider=${PAYMENT_PROVIDER:MERCADO_PAGO}
payment.default-currency=${PAYMENT_DEFAULT_CURRENCY:ARS}

mercado-pago.access-token=${MERCADO_PAGO_ACCESS_TOKEN:}
mercado-pago.webhook-secret=${MERCADO_PAGO_WEBHOOK_SECRET:}
mercado-pago.notification-url=${MERCADO_PAGO_NOTIFICATION_URL:}
mercado-pago.back-url-success=${MERCADO_PAGO_BACK_URL_SUCCESS:https://tienda.com/checkout/success}
mercado-pago.back-url-failure=${MERCADO_PAGO_BACK_URL_FAILURE:https://tienda.com/checkout/failure}
mercado-pago.back-url-pending=${MERCADO_PAGO_BACK_URL_PENDING:https://tienda.com/checkout/pending}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true
