spring.application.name=orderService
server.port=${SERVER_PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.group-id=order-service

outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_INTERVAL_MS:1000}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS:10}

product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://localhost:8080}

spring.http.clients.connect-timeout=${HTTP_CLIENT_CONNECT_TIMEOUT_MS:2000}
spring.http.clients.read-timeout=${HTTP_CLIENT_READ_TIMEOUT_MS:3000}

resilience.max-attempts=${RESILIENCE_MAX_ATTEMPTS:3}
resilience.wait-duration=${RESILIENCE_WAIT_DURATION:200ms}
resilience.wait-duration-multiplier=${RESILIENCE_WAIT_DURATION_MULTIPLIER:2.0}
resilience.failure-rate-threshold=${RESILIENCE_FAILURE_RATE_THRESHOLD:50}
resilience.sliding-window-size=${RESILIENCE_SLIDING_WINDOW_SIZE:10}
resilience.minimum-number-of-calls=${RESILIENCE_MINIMUM_NUMBER_OF_CALLS:5}
resilience.wait-duration-in-open-state=${RESILIENCE_WAIT_DURATION_IN_OPEN_STATE:10s}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.tracing.sampling.probability=${TRACING_SAMPLING_PROBABILITY:0.1}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
logging.structured.format.console=logstash
