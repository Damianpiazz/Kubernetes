spring.application.name=authService

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

jwt.secret=${JWT_SECRET:local-dev-secret-please-change-32chars}
jwt.issuer=${JWT_ISSUER:auth-service}
jwt.access-ttl-seconds=${JWT_ACCESS_TTL_SECONDS:900}
jwt.refresh-ttl-days=${JWT_REFRESH_TTL_DAYS:7}

outbox.relay.poll-interval-ms=${OUTBOX_RELAY_POLL_INTERVAL_MS:1000}
outbox.relay.batch-size=${OUTBOX_RELAY_BATCH_SIZE:50}
outbox.relay.max-attempts=${OUTBOX_RELAY_MAX_ATTEMPTS:10}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka}
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.instance.prefer-ip-address=true